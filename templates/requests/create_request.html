{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white">

                    <h5 class="mb-1">
                        Write a Request
                    </h5>

                    <small class="text-muted">
                        Request a government service or action.
                    </small>

                </div>


                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        {% for field in form %}

                            <div class="mb-3">

                                <label class="form-label">
                                    {{ field.label }}
                                </label>

                                {{ field }}

                                {% if field.errors %}

                                    <div class="text-danger small mt-1">
                                        {{ field.errors }}
                                    </div>

                                {% endif %}

                            </div>

                        {% endfor %}


                        <div class="d-flex gap-2">

                            <a href="{% url 'requests:my_requests' %}"
                               class="btn btn-light">

                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn btn-success">

                                <i class="bi bi-send"></i>
                                Submit Request

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
